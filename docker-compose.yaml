services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  app:
    build:
      context: .
    image: cv-evaluator:latest
    depends_on:
      - minio
    env_file:
      - .env
    environment:
      - MINIO_ENDPOINT=minio:9000
    ports:
      - "8080:8080"

volumes:
  minio_data:
